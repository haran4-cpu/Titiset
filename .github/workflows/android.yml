# Builds the FORGE Android app (a WebView around the web build) on every push and on demand: Actions → "Android APK" → Run.
# The APK (debug-signed, installable by sideloading) is attached to the run as the artifact "FORGE-apk".
name: Android APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: node tools/build.cjs
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: FORGE-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
