# Builds the FORGE Android app (a WebView around the web build) on every push and on demand: Actions → "Android APK" → Run.
# The APK (debug-signed, installable by sideloading) is attached to the run as the artifact "FORGE-apk".
# GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); no SDK set-up step is needed.
name: Android APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node tools/build.cjs
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME/platforms" | tail -3
      - run: gradle -p android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: FORGE-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
