plugins { id 'com.android.application' }
android {
    namespace 'app.forge.decks'
    compileSdk 34
    defaultConfig { applicationId 'app.forge.decks'; minSdk 26; targetSdk 34; versionCode 1000; versionName '10.0.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // the web app (dist/) is copied into the assets by the copyWebApp task: index.html, the workers, the manifest
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
tasks.register('copyWebApp', Copy) {
    from('../../dist') { include 'index.html', 'forge-worklet.js', 'forge-engine.js', 'forge-analysis.js', 'icon.svg', 'manifest.webmanifest' }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp
